{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create New Page
{% endblock %}

{% block body %}
    <h1> Create New Page</h1>
    
    <form action="{% url 'create' %}" method="post">
        {% csrf_token %}
        <textarea id="title" name="title" rows="10" cols="50"
            placeholder = "Enter your Title Name here..."></textarea>
        <input type="submit" value="Create">
    </form>
{% endblock %}
